<template>
    <lightning-card title="Quote PDF">

        <template if:false={showPreview}>
            <lightning-datatable
                key-field="Id"
                data={quoteLines}
                columns={columns}>
            </lightning-datatable>
        </template>

        <template if:true={showPreview}>
            <div class="slds-p-around_medium">
                <iframe
                    src={previewUrl}
                    width="100%"
                    height="500px"
                    frameborder="0"
                    title="Quote Preview">
                </iframe>
            </div>
        </template>

        <template if:true={error}>
            <div class="slds-p-around_medium slds-text-color_error">
                {error}
            </div>
        </template>

        <div class="slds-p-around_medium slds-align_absolute-center">

            <lightning-button
                label="Cancel"
                onclick={handleCancel}>
            </lightning-button>

            <template if:false={showPreview}>
                <lightning-button
                    class="slds-m-left_small"
                    label="Preview"
                    variant="brand"
                    disabled={isPreviewing}
                    onclick={handlePreview}>
                </lightning-button>
            </template>

            <template if:true={showPreview}>
                <lightning-button
                    class="slds-m-left_small"
                    label="Back"
                    onclick={handleBack}>
                </lightning-button>
            </template>

            <lightning-button
                class="slds-m-left_small"
                label="Download PDF"
                icon-name="utility:download"
                variant="brand"
                disabled={isGenerating}
                onclick={handleDownloadPdf}>
            </lightning-button>

            <lightning-button
                class="slds-m-left_small"
                label="Download Word"
                icon-name="utility:download"
                variant="brand-outline"
                disabled={isGenerating}
                onclick={handleDownloadWord}>
            </lightning-button>

        </div>

    </lightning-card>
</template>
